<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学生选课系统登录</title>
    <style>
        .login-box{width:300px;margin:100px auto;padding:20px;border:1px solid #ccc;border-radius:5px;}
        .form-item{margin:15px 0;}
        input{width:100%;padding:8px;box-sizing:border-box;}
        button{width:100%;padding:10px;background:#42b983;color:white;border:none;border-radius:3px;cursor:pointer;}
    </style>
</head>
<body>
    <div class="login-box">
        <h2 style="text-align:center;margin-bottom:20px;">登录</h2>
        <form action="/login" method="post">
            <div class="form-item">
                <input type="text" name="username" placeholder="请输入学号/工号" required>
            </div>
            <div class="form-item">
                <input type="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit">登录</button>
        </form>
    </div>
</body>
</html>
